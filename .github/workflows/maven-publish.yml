name: Gradle Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:  # Renamed for clarity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3  # v3 is more stable than v6
    
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew
    
    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
